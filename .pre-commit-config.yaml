# Pre-commit hooks for fish-ai-containers
# Install: pip install pre-commit && pre-commit install

repos:
  # Fish shell syntax checking
  - repo: https://github.com/fish-shop/syntax-check
    rev: v1.5.2
    hooks:
      - id: syntax-check

  # General file hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-merge-conflict
      - id: check-executables-have-shebangs
      - id: mixed-line-ending
        args: ['--fix=lf']

  # Markdown linting
  - repo: https://github.com/markdownlint/markdownlint
    rev: v0.12.0
    hooks:
      - id: markdownlint
        args: ['--rules', '~MD013,~MD033,~MD041']
        # MD013: line length (too strict)
        # MD033: inline HTML (we use it intentionally)
        # MD041: first line heading (not always needed)

  # Security checks
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.2
    hooks:
      - id: gitleaks

  # Secret detection
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.4.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
